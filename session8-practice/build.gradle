plugins {
    id 'java'
    id 'application'
}

group = 'com.aptech'
version = '1.0'

repositories {
    // Optional reuse of the prepared course Maven cache on the instructor's PC.
    if (providers.gradleProperty('courseMavenCache').isPresent()) {
        maven { url = uri(providers.gradleProperty('courseMavenCache').get()) }
    }
    mavenCentral()
}

dependencies {
    implementation 'com.sun.xml.bind:jaxb-impl:4.0.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

application { mainClass = 'com.aptech.session8.ProductBridge' }

tasks.register('lessonInfo') {
    group = 'learning'
    doLast { println 'Session 8: validate XML, prove a round-trip, prepare JSON, then test Jersey.' }
}
